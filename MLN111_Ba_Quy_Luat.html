const DATA={"lessons":["<h2>Khái niệm và nội dung quy luật mâu thuẫn</h2><h3 id=\"s53\">Mặt đối lập</h3><p class=\"\">Mặt đối lập là những mặt, thuộc tính hoặc khuynh hướng vận động trái ngược nhau, cùng tồn tại khách quan trong sự vật, hiện tượng.</p><p class=\"\">Ví dụ: Trong cơ thể sống, đồng hóa tổng hợp các chất, còn dị hóa phân giải các chất. Hai quá trình có khuynh hướng trái ngược nhưng đều cần thiết cho hoạt động sống.</p><h3 id=\"s56\">Mâu thuẫn biện chứng</h3><p class=\"\">Mâu thuẫn biện chứng là sự thống nhất và đấu tranh giữa các mặt đối lập. Các mặt đối lập vừa liên hệ, ràng buộc và làm tiền đề tồn tại cho nhau, vừa tác động theo những khuynh hướng trái ngược nhau.</p><p class=\"note\">Lưu ý: Không phải hai điều khác nhau hoặc trái ngược bất kỳ đều tạo thành mâu thuẫn biện chứng. Cần xem chúng có liên hệ và tác động qua lại trong một chỉnh thể hay không.</p><h3 id=\"s59\">Sự thống nhất và sự đấu tranh</h3><p class=\"\">Thống nhất: Các mặt đối lập nương tựa, ràng buộc, lấy sự tồn tại của mặt này làm tiền đề cho mặt kia; có thể tác động ngang nhau, tạo trạng thái cân bằng tương đối trong những điều kiện nhất định.</p><p class=\"\">Đấu tranh: Sự tác động qua lại theo hướng bài trừ, phủ định lẫn nhau giữa các mặt đối lập. Khái niệm này áp dụng trong tự nhiên, xã hội và tư duy.</p><h3 id=\"s62\">Nội dung quy luật</h3><p class=\"\">Trong mỗi sự vật, hiện tượng đều tồn tại những mặt đối lập vừa thống nhất vừa đấu tranh với nhau. Sự thống nhất tạo điều kiện cho sự vật tồn tại tương đối ổn định. Sự đấu tranh làm mâu thuẫn phát triển. Khi có điều kiện thích hợp, mâu thuẫn được giải quyết, sự vật chuyển sang trạng thái mới và những mâu thuẫn mới lại xuất hiện.</p><p class=\"\">Sự thống nhất mang tính tương đối; sự đấu tranh mang tính tuyệt đối, gắn với tính liên tục của vận động. Điều này không có nghĩa mọi mâu thuẫn đều biểu hiện thành xung đột gay gắt ở mọi thời điểm.</p><p class=\"takeaway\">Kết luận: Sự thống nhất và đấu tranh giữa các mặt đối lập là nguồn gốc, động lực của sự vận động và phát triển.</p><h2>Tính chất ví dụ và vận dụng quy luật mâu thuẫn</h2><h3 id=\"s68\">Những tính chất cơ bản</h3><div class=\"table-wrap\"><table><tr><th>Tính chất</th><th>Giải thích</th></tr><tr><td>Khách quan</td><td>Mâu thuẫn tồn tại trong bản thân sự vật, không phụ thuộc vào việc con người có muốn hay không.</td></tr><tr><td>Phổ biến</td><td>Mâu thuẫn tồn tại trong tự nhiên, xã hội và tư duy.</td></tr><tr><td>Đa dạng và phong phú</td><td>Mỗi sự vật và mỗi giai đoạn có những mâu thuẫn với đặc điểm, vai trò khác nhau.</td></tr></table></div><h3 id=\"s71\">Ví dụ đồng hóa và dị hóa</h3><p class=\"\">Đồng hóa tổng hợp các chất và tích lũy năng lượng.</p><p class=\"\">Dị hóa phân giải các chất và giải phóng năng lượng.</p><p class=\"\">Sản phẩm và năng lượng của các quá trình này phục vụ, tạo điều kiện cho nhau.</p><p class=\"\">Sự tác động giữa chúng góp phần duy trì và biến đổi cơ thể.</p><p class=\"\">Các mặt đối lập không chỉ bài trừ mà còn cần đến nhau để cùng tồn tại trong một chỉnh thể.</p><h3 id=\"s77\">Ý nghĩa phương pháp luận</h3><p class=\"\">Thừa nhận mâu thuẫn khách quan: Không né tránh hoặc che giấu mâu thuẫn.</p><p class=\"\">Phân tích từng mâu thuẫn cụ thể: Xác định các mặt đối lập, nguyên nhân và điều kiện giải quyết.</p><p class=\"\">Xác định đúng trọng tâm: Phân biệt mâu thuẫn chủ yếu với thứ yếu để tập trung vào vấn đề quan trọng.</p><p class=\"\">Chọn phương pháp phù hợp: Không áp dụng một cách giải quyết cho mọi loại mâu thuẫn.</p><p class=\"\">Vận dụng trong học tập: Khi kết quả chưa đáp ứng yêu cầu, cần tìm đúng vấn đề như thiếu kiến thức nền, phương pháp chưa phù hợp hay chưa đủ thời gian luyện tập. Phân tích đúng giúp lựa chọn cách cải thiện hiệu quả.</p><p class=\"takeaway\">Ghi nhớ: Mâu thuẫn → Động lực → Phát triển.</p>","<h2>Khái niệm và nội dung quy luật Lượng Chất</h2><h3 id=\"s95\">Năm khái niệm nền tảng</h3><div class=\"table-wrap\"><table><tr><th>Khái niệm</th><th>Nội dung</th></tr><tr><td>Chất</td><td>Tính quy định khách quan vốn có của sự vật; sự thống nhất hữu cơ của những thuộc tính khiến sự vật là nó và phân biệt với sự vật khác.</td></tr><tr><td>Lượng</td><td>Tính quy định về số lượng, quy mô, trình độ, nhịp điệu hoặc tốc độ vận động, phát triển.</td></tr><tr><td>Độ</td><td>Khoảng giới hạn mà sự thay đổi về lượng chưa làm thay đổi căn bản chất của sự vật.</td></tr><tr><td>Điểm nút</td><td>Giới hạn mà tại đó sự thay đổi về lượng làm thay đổi chất của sự vật.</td></tr><tr><td>Bước nhảy</td><td>Giai đoạn chuyển hóa căn bản về chất do những thay đổi về lượng trước đó tạo nên.</td></tr></table></div><p class=\"note\">Lưu ý: “Chất” không chỉ có nghĩa là chất lượng tốt hay xấu; “lượng” cũng không chỉ là số lượng đếm được.</p><h3 id=\"s99\">Thay đổi về lượng dẫn đến thay đổi về chất</h3><p class=\"\">Sự vật là sự thống nhất giữa chất và lượng. Trong giới hạn của độ, lượng có thể thay đổi nhưng chất cơ bản chưa thay đổi. Khi sự thay đổi về lượng đạt đến điểm nút, trong những điều kiện nhất định, bước nhảy diễn ra và chất mới hình thành.</p><h3 id=\"s101\">Chất mới tác động trở lại lượng</h3><p class=\"\">Chất mới tạo ra những yêu cầu, điều kiện và khả năng mới cho sự biến đổi về lượng, làm thay đổi quy mô, trình độ, nhịp điệu hoặc tốc độ vận động của sự vật. Quá trình này tiếp tục diễn ra, tạo nên sự vận động và phát triển.</p><p class=\"takeaway\">Kết luận: Tích lũy dần về lượng, chuyển hóa về chất bằng bước nhảy; chất mới lại tác động trở lại sự thay đổi về lượng.</p><h3 id=\"s104\">Các hình thức bước nhảy</h3><div class=\"table-wrap\"><table><tr><th>Tiêu chí</th><th>Hình thức</th><th>Đặc điểm</th></tr><tr><td>Quy mô và phạm vi</td><td>Toàn bộ</td><td>Thay đổi căn bản toàn bộ các mặt, bộ phận cấu thành sự vật.</td></tr><tr><td>Quy mô và phạm vi</td><td>Cục bộ</td><td>Thay đổi về chất một số mặt hoặc bộ phận.</td></tr><tr><td>Nhịp điệu thực hiện</td><td>Đột biến</td><td>Chuyển hóa trong thời gian tương đối ngắn.</td></tr><tr><td>Nhịp điệu thực hiện</td><td>Dần dần</td><td>Chuyển hóa từng bước trong một quá trình.</td></tr></table></div><p class=\"\">Bước nhảy dần dần vẫn là chuyển hóa về chất, không đồng nhất với tích lũy đơn thuần về lượng.</p><h2>Ví dụ và vận dụng quy luật Lượng Chất</h2><h3 id=\"s110\">Ví dụ đun nước</h3><p class=\"\">Ở áp suất khí quyển tiêu chuẩn, nước tinh khiết sôi ở khoảng 100°C.</p><p class=\"\">Khi được đun nóng trong khoảng còn ở trạng thái lỏng, nhiệt độ tăng nhưng trạng thái cơ bản chưa đổi.</p><p class=\"\">Đến nhiệt độ sôi, tiếp tục cung cấp nhiệt dẫn đến quá trình chuyển từ lỏng sang hơi.</p><p class=\"\">Trong quá trình sôi ở áp suất không đổi, nhiệt độ không tiếp tục tăng như trước mà năng lượng được dùng cho sự chuyển trạng thái.</p><p class=\"\">Khi xét trạng thái tồn tại, nước lỏng có những đặc điểm khác hơi nước. Nhiệt độ là biểu hiện của lượng; nhiệt độ sôi ở áp suất xác định là điểm nút; quá trình chuyển trạng thái khi sôi minh họa bước nhảy.</p><p class=\"note\">Nhiệt độ sôi phụ thuộc vào áp suất, nên không thể tách điểm nút khỏi điều kiện cụ thể.</p><h3 id=\"s117\">Vận dụng vào học tập</h3><p class=\"\">Tích lũy kiến thức và luyện tập có hệ thống có thể giúp người học chuyển từ chỉ nhớ công thức sang hiểu và tự giải quyết vấn đề. Năng lực mới hình thành lại giúp họ học nhanh hơn, xử lý bài tập phức tạp hơn.</p><p class=\"note\">Không có một số giờ học cố định bảo đảm mọi người đạt cùng một trình độ; kết quả còn phụ thuộc vào phương pháp và điều kiện học tập.</p><h3 id=\"s120\">Ý nghĩa phương pháp luận</h3><p class=\"\">Kiên trì tích lũy: Chuẩn bị đủ kiến thức, kỹ năng và điều kiện để có chuyển biến căn bản.</p><p class=\"\">Tránh nóng vội: Không đòi hỏi thay đổi về chất khi chưa tích lũy đủ về lượng.</p><p class=\"\">Tránh bảo thủ, trì trệ: Khi điều kiện chín muồi, chủ động thực hiện bước nhảy.</p><p class=\"\">Chọn hình thức chuyển đổi phù hợp với đặc điểm sự vật và hoàn cảnh thực tế.</p><p class=\"takeaway\">Ghi nhớ: Tích lũy lượng → Đạt điểm nút → Bước nhảy → Chất mới → Biến đổi lượng mới.</p>","<h2>Khái niệm và nội dung phủ định của phủ định</h2><h3 id=\"s136\">Phủ định và phủ định biện chứng</h3><p class=\"\">Phủ định là sự thay thế sự vật này bằng sự vật khác, hoặc thay thế một trạng thái tồn tại bằng trạng thái khác trong quá trình vận động.</p><p class=\"\">Phủ định biện chứng là sự phủ định tạo điều kiện, tiền đề cho sự phát triển, thông qua việc giải quyết mâu thuẫn bên trong sự vật.</p><p class=\"\">Tính khách quan: Nguyên nhân của sự phủ định nằm trong sự vận động và phát triển của bản thân sự vật. Điều này không có nghĩa sự vật hoàn toàn không chịu tác động bên ngoài.</p><p class=\"\">Tính kế thừa: Cái mới không xóa bỏ sạch trơn cái cũ mà giữ lại, cải biến những yếu tố phù hợp để phát triển.</p><h3 id=\"s141\">Phủ định của phủ định</h3><p class=\"\">Cái mới ra đời phủ định cái cũ, rồi bản thân nó tiếp tục bị phủ định bởi cái mới tiếp theo. Qua một chu kỳ phát triển, sự vật có thể lặp lại một số đặc điểm của điểm xuất phát, nhưng trên cơ sở mới và ở trình độ cao hơn.</p><h3 id=\"s143\">Nội dung quy luật</h3><p class=\"\">Sự phát triển diễn ra thông qua những lần phủ định biện chứng kế tiếp nhau. Mỗi lần phủ định vừa khắc phục những hạn chế của giai đoạn trước, vừa kế thừa các yếu tố tích cực của giai đoạn đó.</p><div class=\"table-wrap\"><table><tr><th>Đặc điểm xoáy ốc</th><th>Ý nghĩa</th></tr><tr><td>Lặp lại</td><td>Một số đặc điểm của giai đoạn trước xuất hiện trở lại.</td></tr><tr><td>Kế thừa</td><td>Những yếu tố tích cực được giữ lại và cải biến.</td></tr><tr><td>Đi lên</td><td>Sự lặp lại diễn ra trên cơ sở mới, không quay về nguyên trạng ban đầu.</td></tr></table></div><p class=\"\">Con đường phát triển có thể quanh co, phức tạp và có những bước lùi tạm thời.</p><p class=\"takeaway\">Kết luận: Quy luật chỉ ra khuynh hướng phát triển đi lên, có kế thừa, thông qua các lần phủ định biện chứng.</p><h3 id=\"s149\">Phân biệt hai cách phủ định</h3><div class=\"table-wrap\"><table><tr><th>Tiêu chí</th><th>Phủ định biện chứng</th><th>Phủ định siêu hình</th></tr><tr><td>Cách nhìn</td><td>Gắn với vận động, mâu thuẫn và phát triển.</td><td>Xem chủ yếu là xóa bỏ, chấm dứt.</td></tr><tr><td>Với cái cũ</td><td>Kế thừa và cải biến yếu tố phù hợp.</td><td>Phủ nhận sự kế thừa hoặc xóa bỏ sạch trơn.</td></tr><tr><td>Vai trò</td><td>Tạo tiền đề cho phát triển tiếp theo.</td><td>Không xem trong mối liên hệ phát triển.</td></tr></table></div><h2>Ví dụ và vận dụng phủ định của phủ định</h2><h3 id=\"s154\">Ví dụ hạt lúa và cây lúa</h3><p class=\"\">Hạt lúa → Cây lúa → Những hạt lúa mới</p><p class=\"\">Trong điều kiện thích hợp, hạt lúa nảy mầm thành cây lúa; hình thức tồn tại ban đầu của hạt được thay thế bằng cây.</p><p class=\"\">Cây lúa sinh trưởng và tạo những hạt lúa mới; chu trình sinh sản tạo ra hạt của thế hệ tiếp theo.</p><p class=\"\">Những hạt mới tiếp tục một chu kỳ khác; có sự trở lại hình thức “hạt” nhưng không phải hạt ban đầu.</p><p class=\"note\">Đây là ví dụ đơn giản minh họa tính chu kỳ và kế thừa. Không nên hiểu rằng mỗi thế hệ lúa tự động có chất lượng tốt hơn thế hệ trước.</p><h3 id=\"s160\">Vận dụng vào đổi mới phương pháp học</h3><p class=\"\">Khi thay đổi cách học, có thể giữ việc ghi chép có hệ thống, khắc phục thói quen học thuộc máy móc, đồng thời bổ sung việc giải thích bằng lời của mình và vận dụng vào tình huống. Đây là vận dụng tinh thần kế thừa có chọn lọc.</p><h3 id=\"s162\">Ý nghĩa phương pháp luận</h3><p class=\"\">Ủng hộ cái mới tiến bộ: Nhận diện dựa trên nội dung và khả năng phát triển, không chỉ vì nó xuất hiện sau.</p><p class=\"\">Kế thừa có chọn lọc: Giữ giá trị phù hợp, khắc phục yếu tố lỗi thời.</p><p class=\"\">Tránh phủ định sạch trơn: Đổi mới không có nghĩa là loại bỏ toàn bộ thành quả trước đó.</p><p class=\"\">Tránh bảo thủ: Không giữ nguyên cái cũ khi điều kiện đã thay đổi.</p><p class=\"\">Nhìn nhận quá trình lâu dài: Không mất phương hướng trước khó khăn hoặc bước lùi tạm thời.</p><p class=\"note\">Lưu ý: Không phải mọi sự việc trải qua đúng hai lần thay đổi đều là biểu hiện của quy luật. Cần xem đó có phải những lần phủ định biện chứng và có mối liên hệ phát triển hay không.</p><p class=\"takeaway\">Ghi nhớ: Phủ định biện chứng → Kế thừa → Phát triển theo đường xoáy ốc.</p>"],"questions":[{"id":1,"group":0,"text":"Quy luật thống nhất và đấu tranh giữa các mặt đối lập chỉ ra phương diện nào của sự phát triển?","options":["Cách thức của sự phát triển.","Nguồn gốc và động lực của sự phát triển.","Khuynh hướng của sự phát triển.","Tốc độ cố định của sự phát triển."],"answer":1,"explanation":"Quy luật mâu thuẫn chỉ ra nguồn gốc và động lực của sự vận động, phát triển."},{"id":2,"group":0,"text":"Mâu thuẫn biện chứng là gì?","options":["Mọi sự khác nhau giữa hai sự vật bất kỳ.","Sự bất đồng ý kiến giữa các cá nhân.","Sự thống nhất và đấu tranh giữa các mặt đối lập.","Sự tồn tại độc lập của những mặt không liên quan."],"answer":2,"explanation":"Mâu thuẫn biện chứng bao gồm cả sự thống nhất và sự đấu tranh giữa các mặt đối lập."},{"id":3,"group":0,"text":"Sự thống nhất giữa các mặt đối lập thể hiện ở điều nào sau đây?","options":["Các mặt nương tựa, ràng buộc và làm tiền đề tồn tại cho nhau.","Các mặt hoàn toàn giống nhau về mọi thuộc tính.","Các mặt không tác động đến nhau.","Các mặt không còn khuynh hướng trái ngược."],"answer":0,"explanation":"Thống nhất là sự nương tựa, ràng buộc giữa các mặt đối lập; không có nghĩa chúng hoàn toàn giống nhau."},{"id":4,"group":0,"text":"Nhận định nào đúng về sự thống nhất và đấu tranh giữa các mặt đối lập?","options":["Cả sự thống nhất và sự đấu tranh đều chỉ mang tính tạm thời.","Sự thống nhất là tuyệt đối, sự đấu tranh là tương đối.","Sự thống nhất và sự đấu tranh luôn tách rời nhau.","Sự thống nhất là tương đối, sự đấu tranh là tuyệt đối."],"answer":3,"explanation":"Thống nhất gắn với sự ổn định tương đối; đấu tranh gắn với tính liên tục của vận động."},{"id":5,"group":0,"text":"Khi một nhóm học tập xuất hiện bất đồng về cách thực hiện nhiệm vụ, cách xử lý nào phù hợp với ý nghĩa phương pháp luận của quy luật?","options":["Bỏ qua bất đồng để tránh phải thay đổi.","Phân tích nguyên nhân, các ý kiến đối lập và điều kiện cụ thể để tìm cách giải quyết.","Áp dụng cùng một cách giải quyết cho mọi bất đồng.","Loại bỏ ngay mọi ý kiến khác với trưởng nhóm."],"answer":1,"explanation":"Cần phân tích mâu thuẫn cụ thể và lựa chọn cách giải quyết phù hợp với điều kiện thực tế."},{"id":6,"group":1,"text":"“Chất” trong triết học được hiểu là gì?","options":["Mức độ tốt hoặc xấu của một sản phẩm.","Số lượng các bộ phận cấu thành sự vật.","Tốc độ vận động của sự vật.","Tính quy định khách quan, là sự thống nhất hữu cơ của những thuộc tính làm sự vật là nó và phân biệt với sự vật khác."],"answer":3,"explanation":"“Chất” là khái niệm triết học, không chỉ là mức độ tốt hay xấu."},{"id":7,"group":1,"text":"Khoảng giới hạn mà sự thay đổi về lượng chưa làm thay đổi căn bản chất của sự vật được gọi là gì?","options":["Độ.","Điểm nút.","Bước nhảy.","Phủ định."],"answer":0,"explanation":"Trong giới hạn của độ, lượng thay đổi nhưng chất cơ bản chưa thay đổi."},{"id":8,"group":1,"text":"Phân biệt nào sau đây đúng về điểm nút và bước nhảy?","options":["Điểm nút là sự tích lũy về lượng; bước nhảy là trạng thái đứng yên.","Điểm nút và bước nhảy là hai tên gọi có cùng ý nghĩa.","Điểm nút là giới hạn diễn ra sự chuyển hóa về chất; bước nhảy là giai đoạn chuyển hóa căn bản về chất.","Điểm nút chỉ có trong tự nhiên; bước nhảy chỉ có trong xã hội."],"answer":2,"explanation":"Điểm nút là giới hạn; bước nhảy là giai đoạn chuyển hóa về chất."},{"id":9,"group":1,"text":"Sau khi chất mới hình thành, mối quan hệ giữa chất và lượng diễn ra như thế nào?","options":["Lượng ngừng biến đổi.","Chất mới tác động trở lại lượng, làm thay đổi quy mô, trình độ, nhịp điệu hoặc tốc độ vận động.","Chất và lượng không còn liên hệ.","Chất mới luôn làm lượng giảm xuống."],"answer":1,"explanation":"Quan hệ lượng – chất có hai chiều: lượng làm thay đổi chất và chất mới tác động trở lại lượng."},{"id":10,"group":1,"text":"Một sinh viên chưa nắm kiến thức nền và ít luyện tập nhưng muốn lập tức giải được bài nâng cao. Sinh viên đó cần khắc phục khuynh hướng nào?","options":["Bảo thủ khi điều kiện chuyển hóa đã đầy đủ.","Kế thừa có chọn lọc kiến thức cũ.","Tích lũy về lượng một cách có hệ thống.","Nóng vội, muốn có thay đổi về chất khi chưa tích lũy đủ về lượng."],"answer":3,"explanation":"Muốn có chuyển biến về năng lực cần tích lũy kiến thức và luyện tập phù hợp."},{"id":11,"group":2,"text":"Hai đặc trưng cơ bản của phủ định biện chứng là gì?","options":["Tính chủ quan và tính ngẫu nhiên.","Tính tuyệt đối và tính bất biến.","Tính khách quan và tính kế thừa.","Tính biệt lập và tính lặp lại nguyên trạng."],"answer":2,"explanation":"Phủ định biện chứng mang tính khách quan và tính kế thừa."},{"id":12,"group":2,"text":"Tính kế thừa của phủ định biện chứng thể hiện như thế nào?","options":["Giữ lại và cải biến những yếu tố tích cực, phù hợp của cái cũ trong cái mới.","Giữ nguyên toàn bộ cái cũ.","Xóa bỏ mọi yếu tố của cái cũ.","Ghép tùy ý cái cũ với cái mới mà không xét điều kiện."],"answer":0,"explanation":"Kế thừa là giữ lại có chọn lọc và cải biến, không giữ nguyên toàn bộ hay xóa bỏ sạch trơn."},{"id":13,"group":2,"text":"Hình ảnh “đường xoáy ốc” thể hiện đặc điểm nào của sự phát triển?","options":["Luôn trở về đúng trạng thái ban đầu.","Diễn ra theo đường thẳng, không có trở ngại.","Thay đổi ngẫu nhiên, không có sự kế thừa.","Có sự lặp lại một số đặc điểm trên cơ sở mới, thể hiện tính kế thừa và khuynh hướng đi lên."],"answer":3,"explanation":"Đường xoáy ốc thể hiện sự lặp lại, kế thừa và phát triển trên cơ sở mới."},{"id":14,"group":2,"text":"Khi đổi mới cách học, hành động nào thể hiện sự kế thừa có chọn lọc?","options":["Bỏ toàn bộ phương pháp cũ chỉ vì đã sử dụng lâu.","Giữ cách ghi chép hiệu quả, khắc phục học vẹt và bổ sung luyện tập vận dụng.","Giữ nguyên cách học dù kết quả không đáp ứng yêu cầu.","Chọn mọi phương pháp mới mà không đánh giá mức độ phù hợp."],"answer":1,"explanation":"Cách học mới giữ những yếu tố hiệu quả, khắc phục hạn chế và bổ sung yếu tố phù hợp."},{"id":15,"group":2,"text":"Nhận định nào đúng về quy luật phủ định của phủ định?","options":["Mọi sự vật đều phát triển bằng đúng hai lần thay đổi đơn giản.","Bất kỳ cái gì xuất hiện sau cũng tiến bộ hơn cái xuất hiện trước.","Sự phát triển có khuynh hướng đi lên nhưng con đường cụ thể có thể quanh co, phức tạp và có bước lùi tạm thời.","Cái mới hình thành hoàn toàn không có liên hệ với cái cũ."],"answer":2,"explanation":"Khuynh hướng chung là đi lên, nhưng quá trình cụ thể không nhất thiết thẳng tắp."}],"summary":"<div class=\"table-wrap\"><table><tr><th>Nội dung</th><th>Mâu thuẫn</th><th>Lượng – Chất</th><th>Phủ định của phủ định</th></tr><tr><td>Câu hỏi</td><td>Vì sao phát triển?</td><td>Phát triển như thế nào?</td><td>Theo khuynh hướng nào?</td></tr><tr><td>Vai trò</td><td>Nguồn gốc và động lực</td><td>Cách thức</td><td>Khuynh hướng</td></tr><tr><td>Từ khóa</td><td>Mặt đối lập; thống nhất; đấu tranh</td><td>Chất; lượng; độ; điểm nút; bước nhảy</td><td>Phủ định biện chứng; kế thừa; xoáy ốc</td></tr><tr><td>Vận dụng</td><td>Nhận diện và giải quyết đúng mâu thuẫn</td><td>Tích lũy và chuyển đổi đúng lúc</td><td>Đổi mới trên cơ sở kế thừa</td></tr><tr><td>Sai lầm cần tránh</td><td>Né tránh hoặc xử lý máy móc</td><td>Nóng vội hoặc trì trệ</td><td>Phủ định sạch trơn hoặc bảo thủ</td></tr></table></div>","intros":["Vì sao sự vật không đứng yên mà luôn vận động, biến đổi? Theo phép biện chứng duy vật, nguồn gốc và động lực của sự phát triển nằm trong mâu thuẫn bên trong bản thân sự vật.","Không phải mọi thay đổi đều lập tức làm sự vật trở thành một sự vật khác. Nhiều biến đổi nhỏ được tích lũy dần, đến một giới hạn nhất định sẽ tạo ra sự thay đổi căn bản.","Sự phát triển không đơn giản là xóa bỏ cái cũ rồi bắt đầu lại từ đầu. Cái mới hình thành trên cơ sở vượt bỏ những yếu tố không còn phù hợp, đồng thời kế thừa và cải biến những yếu tố tích cực của cái cũ."],"fullNames":["Tên đầy đủ: Quy luật thống nhất và đấu tranh giữa các mặt đối lập.","Tên đầy đủ: Quy luật chuyển hóa từ những thay đổi về lượng thành những thay đổi về chất và ngược lại.","Quy luật phủ định của phủ định"]};

let mode=-1,ids=DATA.questions.map(q=>q.id),answers={},checked=new Set(),submitted=false;
function diagram(i){const nodes=[['Mặt đối lập','Thống nhất: nương tựa, ràng buộc ↔ Đấu tranh: bài trừ, phủ định nhau','Mâu thuẫn vận động; giải quyết khi có điều kiện thích hợp','Sự vật chuyển biến; mâu thuẫn mới xuất hiện'],['Lượng biến đổi, tích lũy','Đạt điểm nút và đủ điều kiện','Bước nhảy → Chất mới','Chất mới tác động trở lại lượng'],['Sự vật ban đầu','Phủ định biện chứng: khắc phục hạn chế, kế thừa yếu tố tích cực','Giai đoạn mới → Tiếp tục phủ định biện chứng','Lặp lại trên cơ sở mới, cao hơn: khuynh hướng xoáy ốc']][i];return `<div class="diagram" id="diagram"><h2>Sơ đồ ghi nhớ</h2><div class="flow">${nodes.map((n,k)=>`${k?'<span class="arrow" aria-hidden="true">→</span>':''}<div class="node"><b>0${k+1}</b>${n}</div>`).join('')}</div><p>${['Các mâu thuẫn mới tiếp tục vận động và phát triển. “Đấu tranh” không chỉ có nghĩa là tranh cãi hoặc đánh nhau.','Chưa đạt điểm nút: lượng tiếp tục biến đổi trong độ, chất cơ bản chưa đổi. Sau bước nhảy, lượng tiếp tục biến đổi trên cơ sở chất mới.','Sơ đồ biểu diễn mối liên hệ phát triển. “Xoáy ốc” là sự lặp lại có kế thừa trên cơ sở mới, ở trình độ cao hơn.'][i]}</p></div>`}
function overview(){main.innerHTML=`<div class="hero"><div><div class="eyebrow">Triết học Mác – Lênin</div><h1>Ba quy luật cơ bản<br>của phép <span>biện chứng<br>duy vật.</span></h1><p class="lead">Hiểu nguồn gốc, cách thức và khuynh hướng của sự phát triển.</p><p>Thế giới luôn vận động và biến đổi. Trong tự nhiên, xã hội và tư duy, sự phát triển diễn ra thông qua những mối liên hệ và quy luật khách quan.</p></div><div class="map" aria-label="Sơ đồ tổng quan ba quy luật"><div class="map-label">Ba câu hỏi về sự phát triển</div>${titles.map((t,i)=>`<div class="map-row"><span class="map-num">0${i+1}</span><div><small>${['Vì sao phát triển?','Phát triển như thế nào?','Theo khuynh hướng nào?'][i]}</small><strong>${t}</strong><small>${roles[i]}</small></div></div>`).join('')}</div></div><div class="section-head"><h2>Khám phá từng quy luật</h2><span>03 bài học · 15 câu trắc nghiệm</span></div><div class="cards">${titles.map((t,i)=>`<a class="card" href="#${routes[i+1]}"><span class="card-number">QUY LUẬT 0${i+1}</span><h3>${t}</h3><p>${['Khám phá sự thống nhất và đấu tranh giữa các mặt đối lập trong mỗi sự vật.','Tìm hiểu quá trình tích lũy về lượng dẫn đến bước chuyển về chất.','Nhận diện sự kế thừa và phát triển theo đường xoáy ốc.'][i]}</p><span class="card-link">Tìm hiểu bài học →</span></a>`).join('')}</div><div class="memory"><strong>Động lực – Cách thức – Khuynh hướng</strong><p>Mâu thuẫn tạo động lực – Lượng chất chỉ cách thức – Phủ định chỉ khuynh hướng.</p></div><h2>Đặt ba quy luật cạnh nhau</h2><p>Ba quy luật có quan hệ chặt chẽ, cùng làm rõ những phương diện cơ bản của quá trình phát triển.</p>${DATA.summary}<p>Muốn hiểu sự phát triển, hãy tìm mâu thuẫn tạo động lực, nhận diện sự tích lũy dẫn đến chuyển biến và xem cái mới kế thừa cái cũ như thế nào.</p>`}
function lesson(i){main.innerHTML=`<div class="eyebrow">Quy luật 0${i+1} · ${roles[i]}</div><h1>${titles[i]}</h1><p><strong>${E(DATA.fullNames[i])}</strong></p><p class="lead">${E(DATA.intros[i])}</p>${diagram(i)}<div class="lesson-grid"><aside class="lesson-nav" aria-label="Trong bài học"><strong>TRONG BÀI HỌC</strong><a href="#diagram">Sơ đồ ghi nhớ</a>${(DATA.lessons[i].match(/<h3[^>]*>.*?<\/h3>/g)||[]).map(h=>{let id=h.match(/id="([^"]+)"/)[1];return `<a href="#${id}">${h.replace(/<[^>]+>/g,'')}</a>`}).join('')}</aside><article class="article">${DATA.lessons[i]}<button class="primary" onclick="startQuiz(${i})">Luyện tập quy luật này · 5 câu →</button></article></div>`}
function startQuiz(group,list){mode=group;ids=list||DATA.questions.filter(q=>group<0||q.group===group).map(q=>q.id);answers={};checked=new Set();submitted=false;if(location.hash!=='#trac-nghiem')location.hash='trac-nghiem';else quiz();window.scrollTo(0,0)}
function feedback(q){return `<div class="feedback" role="status"><strong>${answers[q.id]===q.answer?'✓ Chính xác':'Chưa chính xác'} · Đáp án ${'ABCD'[q.answer]}</strong>${E(q.explanation)}</div>`}
function question(q){let reveal=submitted||checked.has(q.id);return `<section class="question" id="q${q.id}"><div class="q-meta">Câu ${q.id} · ${titles[q.group]}</div><h2 id="label${q.id}">${E(q.text)}</h2><div role="radiogroup" aria-labelledby="label${q.id}">${q.options.map((o,j)=>`<label class="option ${reveal?(j===q.answer?'correct':answers[q.id]===j?'wrong':''):''}"><input type="radio" name="q${q.id}" value="${j}" ${answers[q.id]===j?'checked':''} ${reveal?'disabled':''} onchange="choose(${q.id},${j})"><span><b>${'ABCD'[j]}.</b> ${E(o)}</span></label>`).join('')}</div>${reveal?feedback(q):mode>=0?`<button class="secondary" id="check${q.id}" onclick="check(${q.id})" ${answers[q.id]===undefined?'disabled':''}>Kiểm tra</button>`:''}</section>`}
function choose(id,value){answers[id]=value;let b=document.getElementById('check'+id);if(b)b.disabled=false;updateProgress()}
function updateProgress(){let n=ids.filter(id=>answers[id]!==undefined).length;document.getElementById('answered').textContent=`Đã chọn ${n}/${ids.length} câu`;document.getElementById('bar').style.width=(n/ids.length*100)+'%';let b=document.getElementById('submit');if(b)b.disabled=n!==ids.length}
function check(id){if(answers[id]===undefined)return;checked.add(id);const q=DATA.questions.find(q=>q.id===id);document.getElementById('q'+id).outerHTML=question(q);if(ids.every(id=>checked.has(id))){submitted=true;quiz()}}
function submit(){if(ids.some(id=>answers[id]===undefined))return;submitted=true;quiz();main.focus();window.scrollTo(0,0)}
function retryWrong(){const wrong=ids.filter(id=>answers[id]!==DATA.questions.find(q=>q.id===id).answer);if(wrong.length)startQuiz(mode,wrong)}
function quiz(){let correct=ids.filter(id=>answers[id]===DATA.questions.find(q=>q.id===id).answer).length;main.innerHTML=`<div class="eyebrow">Ôn tập & tự kiểm tra</div><h1>Hiểu bài qua từng câu hỏi.</h1><p class="lead">Luyện tập 5 câu theo từng quy luật hoặc kiểm tra tổng hợp 15 câu.</p><div class="quiz-toolbar">${['Kiểm tra tổng hợp',...titles].map((t,i)=>`<button class="secondary" aria-pressed="${mode===i-1}" onclick="startQuiz(${i-1})">${t}</button>`).join('')}</div><div class="quiz-layout">${submitted?`<div class="score" role="status"><h2>Kết quả: ${correct}/${ids.length} câu đúng</h2>${titles.map((t,g)=>{let group=ids.filter(id=>DATA.questions[id-1].group===g);return group.length?`<p>${t}: ${group.filter(id=>answers[id]===DATA.questions[id-1].answer).length}/${group.length}</p>`:''}).join('')}</div><div class="actions"><button class="primary" onclick="retryWrong()" ${correct===ids.length?'disabled':''}>Làm lại câu sai</button><button class="secondary" onclick="startQuiz(mode)">Làm lại toàn bộ</button></div>`:`<p>${mode<0?'Chọn một đáp án cho mỗi câu. Đáp án và giải thích sẽ xuất hiện sau khi nộp bài.':'Chọn đáp án rồi bấm “Kiểm tra” ở từng câu để xem giải thích.'}</p>`}<p id="answered" aria-live="polite"></p><div class="progress" aria-hidden="true"><span id="bar"></span></div>${ids.map(id=>question(DATA.questions[id-1])).join('')}${!submitted&&mode<0?'<button class="primary" id="submit" onclick="submit()">Nộp bài</button>':''}</div>`;updateProgress()}
function render(){const hash=location.hash.slice(1)||'tong-quan';let index=routes.indexOf(hash);if(index<0)return;document.querySelectorAll('nav a').forEach((a,i)=>{a.classList.toggle('active',i===index);if(i===index)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});if(index===0)overview();else if(index===4)quiz();else lesson(index-1);document.title=(index===0?'Ba quy luật cơ bản':index===4?'Trắc nghiệm':titles[index-1])+' · MLN111';window.scrollTo(0,0)}
window.addEventListener('hashchange',render);render();
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'start_practice',title:'Mở bài luyện tập',description:'Mở bài luyện tập cho một quy luật hoặc bài kiểm tra tổng hợp; bắt đầu lại các lựa chọn trong bài.',inputSchema:{type:'object',properties:{group:{type:'integer',enum:[-1,0,1,2]}},required:['group'],additionalProperties:false},annotations:{readOnlyHint:false},execute:async({group})=>{if(![-1,0,1,2].includes(group))throw new Error('Nhóm không hợp lệ');startQuiz(group);quiz();return{group,questions:ids.length}}})).catch(()=>{})}catch{}}
</script></body></html>
